<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Music Player</title>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
        font-family: Arial, sans-serif;
    }

    .player {
        width: 300px;
        background: #fff;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        text-align: center;
    }

    .song-name {
        margin-bottom: 15px;
        font-weight: bold;
    }

    .progress-bar {
        width: 100%;
        height: 10px;
        background: #ddd;
        border-radius: 5px;
        overflow: hidden;
        margin-bottom: 15px;
    }

    .progress {
        width: 50%; /* simulate progress */
        height: 100%;
        background: #4CAF50;
        animation: progressAnim 2s linear infinite;
    }

    @keyframes progressAnim {
        0% { width: 0%; }
        50% { width: 50%; }
        100% { width: 100%; }
    }

    .controls {
        display: flex;
        justify-content: space-around;
    }

    .button {
        width: 30px;
        height: 30px;
        background: #4CAF50;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }
</style>
</head>
<body>
    <div class="player">
        <div class="song-name">Playing: My Song</div>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
        <div class="controls">
            <div class="button">&#9664;</div>
            <div class="button">&#9654;</div>
            <div class="button">&#9724;</div>
        </div>
    </div>
</body>
</html>
